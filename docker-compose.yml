services:
  postgres:
    image: postgres:18-alpine
    container_name: conduit-full-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - conduit-full-postgres-data:/var/lib/postgresql

volumes:
  conduit-full-postgres-data:

services:
  postgres:
    image: postgres:18-alpine
    container_name: conduit-full-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-conduit}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - conduit-full-postgres-data:/var/lib/postgresql

  app:
    build: .
    container_name: conduit-full-app
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      NODE_ENV: production
      PORT: "3001"
      PROD_DB_DIALECT: postgres
      PROD_DB_USERNAME: ${PROD_DB_USERNAME:?set PROD_DB_USERNAME}
      PROD_DB_PASSWORD: ${PROD_DB_PASSWORD:?set PROD_DB_PASSWORD}
      PROD_DB_NAME: ${PROD_DB_NAME:-conduit_production}
      PROD_DB_HOSTNAME: postgres
      PROD_DB_PORT: "5432"
      PROD_DB_LOGGING: "false"
      JWT_KEY: ${JWT_KEY:?set JWT_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN}
    ports:
      - "3001:3001"
volumes:
  conduit-full-postgres-data:
